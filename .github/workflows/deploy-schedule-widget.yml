name: Deploy Schedule Widget

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync content from remote archives (optional)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets['GOOGLE_SERVICE_ACCOUNT_JSON'] }}
          DRIVE_SCHEDULE_FOLDER_ID: ${{ secrets['DRIVE_SCHEDULE_FOLDER_ID'] }}
          CONTENT_SCHEDULE_URL: ${{ secrets['CONTENT_SCHEDULE_URL'] }}
        run: npm run sync:content

      - name: Restore previous widgets output
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: widgets-dist
          path: .widgets-dist

      - name: Merge previous widgets into dist
        run: |
          mkdir -p dist
          if [ -d .widgets-dist ]; then
            rsync -a --exclude='.git' .widgets-dist/ dist/
          fi

      - name: Build schedule manifest
        run: npm run build:schedule

      - name: Build schedule widget
        run: npm run build:schedule-widget

      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Persist merged widgets output
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: widgets-dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: sync widgets dist [skip ci]'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
